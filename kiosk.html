<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ff8bc6"><title>CrazyCreations · Kiosk</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:linear-gradient(130deg,#fff0f8,#f4eaff 45%,#e9faff);font-family:'DM Sans',sans-serif;color:#973b8b;display:flex;flex-direction:column}.top{padding:14px 3vw;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(100deg,#ff69b2,#b978ff,#61c8ee,#ffad67);color:#fff;flex-shrink:0}.brand{font:800 23px Outfit}.controls{display:flex;gap:9px}.controls button{color:#fff;font-weight:800;background:#ffffff2b;border:1px solid #ffffff88;padding:10px 15px;border-radius:24px;cursor:pointer}.hero{text-align:center;padding:clamp(16px,3vh,36px) 15px 18px;flex-shrink:0}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:900;color:#c44b9b}.hero h1{font:800 clamp(34px,5vw,66px)/1.03 Outfit;margin:8px 0;background:linear-gradient(90deg,#f04f9e,#a56aff,#41b8df);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:clamp(13px,1.4vw,18px);color:#a36c9d;margin:0}.grid{width:min(1700px,96vw);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);flex:1;min-height:0;padding-bottom:12px}.card{background:#fff;border:1px solid #f3cce5;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #ce7fb329;animation:rise .6s both;min-height:0;display:flex;flex-direction:column}.photo{flex:1;min-height:0;background:linear-gradient(130deg,#ffc5e2,#d9c4ff,#b8edff);position:relative}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:12px 15px;flex-shrink:0}.info h2{margin:0 0 5px;font:800 clamp(16px,1.6vw,22px) Outfit;color:#ad3f91}.desc{font-size:12px;color:#a76b9d;line-height:1.4;max-height:34px;overflow:hidden}.price{font:800 19px Outfit;color:#a53d91}.sold{font-size:11px;color:#b174a5;margin-top:4px}.star{position:absolute;top:11px;left:11px;padding:7px 10px;background:linear-gradient(100deg,#ff62aa,#ffad69);color:#fff;border-radius:22px;font-size:12px;font-weight:900}.footer{text-align:center;padding:8px;color:#ad6c9f;font-size:11px;flex-shrink:0}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}body:fullscreen .top{padding-top:10px;padding-bottom:10px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.photo{min-height:0}}@media(max-width:520px){.top{padding:10px}.brand{font-size:17px}.controls button{padding:8px;font-size:11px}.hero{padding:12px}.grid{gap:8px;width:98vw}.info{padding:8px}.info h2{font-size:15px}.desc{font-size:10px}.price{font-size:16px}.footer{font-size:9px}}
</style></head><body><header class="top"><div class="brand">CrazyCreations · KIOSK</div><div class="controls"><button onclick="goFullscreen()">⛶ Full screen</button><button onclick="exitKiosk()">Exit kiosk</button></div></header><section class="hero"><div class="eyebrow">HANDMADE WITH CARE</div><h1>What's everyone loving?</h1><p>Our hand-picked, starred creations.</p></section><main id="grid" class="grid"><div class="empty">Loading starred creations…</div></main><footer class="footer">CrazyCreations · Lovely things, made with imagination · Pay on delivery</footer>
<script>
const API="https://script.google.com/macros/s/AKfycbySzBM9pwxqNBwz_Ck2WF6IG7P0wiurQwqmg-mrsSqVwFas4-RymXuxkc5T7qtlE_QE/exec";
function api(action,payload={}){return new Promise((resolve,reject)=>{let cb='kiosk'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('Shop data did not load'))},25000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{clean();r&&r.ok?resolve(r.data):reject(Error(r?.error||'Unable to load'))};s.onerror=()=>{clean();reject(Error('Unable to connect to the shop'))};s.src=API+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload))+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'£'+Number(n||0).toFixed(2);
async function load(){try{let d=await api('public'),list=(d.topSellers||[]).filter(p=>p.featured).slice(0,8);document.getElementById('grid').innerHTML=list.length?list.map((p,i)=>'<article class="card"><div class="photo">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'')+'<span class="star">★ FEATURED</span></div><div class="info"><h2>'+esc(p.name)+'</h2><div class="desc">'+esc(p.description||'A lovely handmade creation.')+'</div><div class="price">'+money(p.price)+'</div><div class="sold">'+(p.sold?p.sold+' sold so far':'Hand-picked for our kiosk')+'</div></div></article>').join(''):'<div style="grid-column:1/-1;display:grid;place-items:center;text-align:center;background:#fff9fd;border:2px dashed #e8badd;border-radius:25px;color:#a45c96;font-size:clamp(18px,3vw,30px);padding:30px">No starred creations yet. Star creations in the admin dashboard to show them here.</div>'}catch(e){document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:35px;color:#a45c96">'+esc(e.message)+'</div>'}}
async function goFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('Use your browser full-screen shortcut to enter full screen.')}} 
async function exitKiosk(){const pin=prompt('Enter the admin code to exit kiosk mode:');if(pin===null)return;try{await api('login',{pin});if(document.fullscreenElement)await document.exitFullscreen();location.href='admin.html'}catch(e){alert('Incorrect code. Kiosk mode will stay open.')}} 
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement){e.preventDefault();exitKiosk()}});
load();setInterval(load,60000);
</script></body></html>
