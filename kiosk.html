<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8bc6"><title>CrazyCreations · Kiosk</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(130deg,#fff0f8,#f4eaff 45%,#e9faff);font-family:'DM Sans',sans-serif;color:#973b8b}.top{padding:20px 4vw;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(100deg,#ff69b2,#b978ff,#61c8ee,#ffad67);color:#fff}.brand{font:800 25px Outfit}.top a{color:#fff;text-decoration:none;font-weight:800;background:#ffffff2b;border:1px solid #ffffff66;padding:10px 16px;border-radius:25px}.hero{text-align:center;padding:clamp(28px,5vw,65px) 20px 35px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:900;color:#c44b9b}.hero h1{font:800 clamp(38px,6vw,76px)/1.05 Outfit;margin:12px 0;background:linear-gradient(90deg,#f04f9e,#a56aff,#41b8df);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:clamp(14px,2vw,19px);color:#a36c9d;margin:0}.grid{width:min(1500px,94vw);margin:0 auto 50px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid #f3cce5;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px #ce7fb329;animation:rise .6s both}.photo{height:clamp(210px,22vw,310px);background:linear-gradient(130deg,#ffc5e2,#d9c4ff,#b8edff);position:relative}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:18px}.info h2{margin:0 0 8px;font:800 21px Outfit;color:#ad3f91}.desc{font-size:13px;color:#a76b9d;min-height:36px;line-height:1.5}.price{font:800 23px Outfit;color:#a53d91}.old{font:600 13px 'DM Sans';color:#bd91b4;text-decoration:line-through;margin-left:8px}.badge{position:absolute;top:13px;left:13px;padding:8px 12px;background:linear-gradient(100deg,#ff62aa,#ffad69);color:#fff;border-radius:22px;font-size:11px;font-weight:900}.sold{font-size:11px;color:#b174a5;margin-top:7px}.footer{text-align:center;padding:25px;color:#ad6c9f;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:45px;border:2px dashed #e8badd;border-radius:25px;background:#fff9fd;color:#a45c96;font-size:18px}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.photo{height:210px}.info{padding:13px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.photo{height:270px}.top{padding:15px}.brand{font-size:20px}}
</style></head><body><header class="top"><div class="brand">CrazyCreations · KIOSK</div><a href="index.html">Visit shop ↗</a></header><section class="hero"><div class="eyebrow">HANDMADE WITH CARE</div><h1>What's everyone loving?</h1><p>Discover our best-selling creations and special offers.</p></section><main id="grid" class="grid"><div class="empty">Loading the latest creations…</div></main><footer class="footer">CrazyCreations · Lovely things, made with imagination · Pay on delivery</footer>
<script>
const API="https://script.google.com/macros/s/AKfycbySzBM9pwxqNBwz_Ck2WF6IG7P0wiurQwqmg-mrsSqVwFas4-RymXuxkc5T7qtlE_QE/exec";
function api(action){return new Promise((resolve,reject)=>{let cb='kiosk'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Shop data did not load'))},25000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{clean();r&&r.ok?resolve(r.data):reject(Error(r?.error||'Unable to load'))};s.onerror=()=>{clean();reject(Error('Unable to connect to the shop'))};s.src=API+'?action='+encodeURIComponent(action)+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;'}[c]));
const money=n=>'£'+Number(n||0).toFixed(2);
async function load(){try{let d=await api('public'),all=d.topSellers||[],on=all.filter(p=>p.onSale),list=(on.length?on:all).slice(0,8);document.getElementById('grid').innerHTML=list.length?list.map((p,i)=>'<article class="card"><div class="photo">'+(p.onSale?'<span class="badge">SPECIAL OFFER</span>':'')+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'')+'</div><div class="info"><h2>'+(i===0?'★ ':'')+esc(p.name)+'</h2><div class="desc">'+esc(p.description||'A lovely handmade creation.')+'</div><div class="price">'+(p.onSale&&Number(p.salePrice)>0?money(p.salePrice)+' <span class="old">'+money(p.price)+'</span>':money(p.price))+'</div><div class="sold">'+(p.sold?p.sold+' sold so far':'Freshly made and ready to discover')+'</div></div></article>').join(''):'<div class="empty">New handmade creations are coming soon!</div>'}catch(e){document.getElementById('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
load();setInterval(load,60000);
</script></body></html>
