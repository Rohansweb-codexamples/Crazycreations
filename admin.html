<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrazyCreations Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf3;color:#21170f;font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#21170f;color:white;padding:18px 5%;display:flex;justify-content:space-between}.brand{font:700 24px 'Space Grotesk'}.brand span{color:#ff9634}.top a{color:white;text-decoration:none}.wrap{max-width:1250px;margin:35px auto;padding:0 20px}.box{background:white;border:1px solid #eee1d5;border-radius:18px;padding:24px;box-shadow:0 10px 35px #45220b08}.login{max-width:420px;margin:70px auto}.login h1,.box h1{font:700 30px 'Space Grotesk';margin:0 0 8px}.muted{color:#81766d}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #eee1d5;border-radius:10px}.btn{border:0;background:#ff7417;color:white;border-radius:10px;padding:12px 16px;font-weight:800}.wide{width:100%}.secondary{border:1px solid #eee1d5;background:white;border-radius:9px;padding:9px 12px;font-weight:700}.notice{padding:12px;border-radius:10px;background:#eff9f1;color:#17623a;margin:12px 0}.error{background:#fff0ed;color:#a52d18}.hidden{display:none!important}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left;border:0;background:#f5eee6;padding:13px;border-radius:10px;font-weight:800}.nav button.active{background:#ffdfb5;color:#8f3c00}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.toolbar h2{font:700 27px 'Space Grotesk';margin:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:700px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #eee1d5;vertical-align:top}th{color:#81766d}td select{padding:7px;border:1px solid #eee1d5;border-radius:8px}.product{border:1px solid #eee1d5;border-radius:13px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.product h3{margin:0 0 5px}.actions{display:flex;gap:7px}.empty{padding:30px;text-align:center;background:#fffaf5;border:1px dashed #eee1d5;border-radius:12px;color:#81766d}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap}.product{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="brand">Crazy<span>Creations</span> / ADMIN</div><a href="index.html">← View shop</a></header><div class="wrap"><section id="login" class="box login"><h1>Admin sign in</h1><p class="muted">Manage products, orders and deliveries.</p><form onsubmit="login(event)"><div class="field"><label>Admin PIN</label><input id="pin" type="password" required></div><div id="loginMsg"></div><button class="btn wide">Sign in</button></form></section><section id="dash" class="box hidden"><div class="toolbar"><div><h1>Store dashboard</h1><span class="muted">Your CrazyCreations control centre</span></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="layout"><nav class="nav"><button class="active" onclick="tab('orders',this)">Orders & delivery</button><button onclick="tab('products',this)">Products</button><button onclick="tab('settings',this)">Website settings</button></nav><div id="content">Loading…</div></div></section></div>
<div id="dlg" class="hidden" style="position:fixed;inset:0;background:#0009;z-index:4;display:flex;align-items:center;justify-content:center;padding:15px"><div class="box" style="width:min(570px,100%);max-height:90vh;overflow:auto"><div class="toolbar"><h2 id="dlgTitle">Add product</h2><button class="secondary" onclick="closeDlg()">Close</button></div><form onsubmit="saveProduct(event)"><input id="pid" type="hidden"><div class="field"><label>Product name *</label><input id="pname" required></div><div class="field"><label>Description</label><textarea id="pdesc"></textarea></div><div class="field"><label>Price (£)</label><input id="pprice" type="number" min="0" step=".01" required></div><div class="field"><label>Stock</label><input id="pstock" type="number" min="0" required></div><div class="field"><label>Image URL</label><input id="pimage" type="url"></div><div class="field"><label><input id="pactive" type="checkbox" checked style="width:auto"> Visible in shop</label></div><button class="btn wide">Save product</button></form></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwsAWtIo4WHXHaZwWx-1e5Q1B9PENZBuOjC5Bd3B2jVibcqnMGx3WmnpVNqJUeeu50/exec";let token='',data=null,section='orders';
function api(action,payload={}){return new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/(?:a\/)?macros\/(?:s\/|[^/]+\/s\/)[A-Za-z0-9_-]+\/exec$/.test(API))return reject(Error('Add your deployed Apps Script URL to admin.html.'));let cb='adm'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('Apps Script did not respond. Check URL and deployment access.'))},20000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{clean();r&&r.ok?resolve(r.data):reject(Error(r?.error||'Request failed'))};s.onerror=()=>{clean();reject(Error('Could not connect to Apps Script.'))};s.src=API+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload))+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Number(n||0).toFixed(2);
function notice(id,s,err=false){document.getElementById(id).innerHTML='<div class="notice '+(err?'error':'')+'">'+esc(s)+'</div>'}
async function login(e){e.preventDefault();try{let r=await api('login',{pin:document.getElementById('pin').value});token=r.token;document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');await refresh()}catch(e){notice('loginMsg',e.message,true)}}
function logout(){token='';data=null;document.getElementById('dash').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('pin').value=''}
async function refresh(){data=await api('adminData',{token});render()}
function tab(t,b){section=t;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}
function render(){if(!data)return;let el=document.getElementById('content');if(section==='orders'){let a=data.orders||[];el.innerHTML='<div class="toolbar"><h2>Orders & delivery</h2><button class="secondary" onclick="refresh()">Refresh</button></div>'+(a.length?'<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>'+a.map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><small>'+esc(o.date)+'</small></td><td><b>'+esc(o.customer)+'</b><br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+esc(o.items)+'</td><td>'+money(o.total)+'<br><small>Pay on delivery</small></td><td><select onchange="updateOrder(\''+esc(o.id)+'\',this.value)">'+['New','Processing','Dispatched','Out for delivery','Delivered','Cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No orders yet. New orders appear here.</div>')+'<p><a target="_blank" href="'+esc(data.sheetUrl)+'">Open connected Google Sheet ↗</a></p>'}
else if(section==='products'){el.innerHTML='<div class="toolbar"><h2>Products</h2><button class="btn" onclick="openDlg()">+ Add product</button></div>'+(data.products.length?data.products.map(p=>'<div class="product"><div><h3>'+esc(p.name)+'</h3><span class="muted">'+money(p.price)+' · Stock '+esc(p.stock)+' · '+(p.active?'Visible':'Hidden')+'</span></div><div class="actions"><button class="secondary" onclick="openDlg(\''+esc(p.id)+'\')">Edit</button><button class="secondary" onclick="delProduct(\''+esc(p.id)+'\')">Delete</button></div></div>').join(''):'<div class="empty">No products yet. Add your first product.</div>')}
else{el.innerHTML='<h2>Website settings</h2><form onsubmit="saveSettings(event)"><div class="field"><label>Store name</label><input id="sname" value="'+esc(data.settings.StoreName||'CrazyCreations')+'"></div><div class="field"><label>Announcement banner</label><input id="sannouncement" value="'+esc(data.settings.Announcement||'')+'"></div><div class="field"><label>Delivery message</label><input id="sdelivery" value="'+esc(data.settings.DeliveryMessage||'Pay on delivery')+'"></div><button class="btn">Save settings</button></form><p><a target="_blank" href="'+esc(data.sheetUrl)+'">Open Google Sheets database ↗</a></p>'}}
async function updateOrder(id,status){try{await api('updateOrder',{token,id,status});await refresh()}catch(e){alert(e.message)}}
function openDlg(id=''){let p=(data.products||[]).find(x=>x.id===id);document.getElementById('dlgTitle').textContent=p?'Edit product':'Add product';document.getElementById('pid').value=p?.id||'';document.getElementById('pname').value=p?.name||'';document.getElementById('pdesc').value=p?.description||'';document.getElementById('pprice').value=p?.price??'';document.getElementById('pstock').value=p?.stock??0;document.getElementById('pimage').value=p?.image||'';document.getElementById('pactive').checked=!p||p.active;document.getElementById('dlg').classList.remove('hidden')}
function closeDlg(){document.getElementById('dlg').classList.add('hidden')}
async function saveProduct(e){e.preventDefault();let p={token,id:document.getElementById('pid').value,name:document.getElementById('pname').value,description:document.getElementById('pdesc').value,price:document.getElementById('pprice').value,stock:document.getElementById('pstock').value,image:document.getElementById('pimage').value,active:document.getElementById('pactive').checked};try{await api('saveProduct',p);closeDlg();await refresh()}catch(e){alert(e.message)}}
async function delProduct(id){if(!confirm('Delete this product?'))return;try{await api('deleteProduct',{token,id});await refresh()}catch(e){alert(e.message)}}
async function saveSettings(e){e.preventDefault();try{await api('saveSettings',{token,settings:{StoreName:document.getElementById('sname').value,Announcement:document.getElementById('sannouncement').value,DeliveryMessage:document.getElementById('sdelivery').value}});await refresh();alert('Settings saved')}catch(e){alert(e.message)}}
</script></body></html>
