<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrazyCreations Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fc,#f5e8fa);color:#39263a;font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#432b46;color:white;padding:20px max(5%,calc((100% - 1250px)/2));display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px #46244918}.brand{font:800 25px 'Space Grotesk';letter-spacing:-1px}.brand span{color:#ffacd3}.top a{color:white;text-decoration:none;font-weight:700;font-size:13px}.wrap{max-width:1250px;margin:38px auto;padding:0 20px}.box{background:#fff;border:1px solid #f0dce9;border-radius:22px;padding:27px;box-shadow:0 15px 40px #603a6010}.login{max-width:430px;margin:75px auto}.login h1,.box h1{font:700 31px 'Space Grotesk';margin:0 0 8px}.muted{color:#8a7488}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #ead8e7;border-radius:11px;background:#fffbfd;outline:none}.field input:focus,.field textarea:focus{border-color:#db78b3}.btn{border:0;background:linear-gradient(110deg,#e96eae,#a77ad5);color:white;border-radius:25px;padding:13px 19px;font-weight:800;box-shadow:0 6px 15px #ce78ae35}.wide{width:100%}.secondary{border:1px solid #ecd9e8;background:#fff7fc;border-radius:10px;padding:10px 13px;font-weight:700;color:#684467}.notice{padding:13px;border-radius:11px;background:#f1eafa;color:#75429a;margin:12px 0}.error{background:#fff0f6;color:#a52d73}.hidden{display:none!important}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:23px}.nav{display:flex;flex-direction:column;gap:9px}.nav button{text-align:left;border:1px solid transparent;background:#fff5fb;padding:14px;border-radius:12px;font-weight:800;color:#654862}.nav button.active{background:linear-gradient(110deg,#f8d5e8,#eadcf9);border-color:#edc9e2;color:#583452}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.toolbar h2{font:700 28px 'Space Grotesk';margin:0}.tablewrap{overflow:auto;border:1px solid #f1e2ed;border-radius:13px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:700px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #f1e2ed;vertical-align:top}th{color:#8a7488;background:#fff8fc;font-size:11px;text-transform:uppercase;letter-spacing:.6px}td select{padding:8px;border:1px solid #ead8e7;border-radius:8px;background:white}.product{border:1px solid #f0dce9;border-radius:14px;padding:16px;margin:11px 0;display:flex;justify-content:space-between;gap:15px;align-items:center;background:#fffafd}.product h3{margin:0 0 6px;font-size:16px}.actions{display:flex;gap:7px}.empty{padding:32px;text-align:center;background:#fff8fc;border:1px dashed #e8cfe0;border-radius:13px;color:#8a7488}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap}.product{align-items:flex-start;flex-direction:column}.wrap{margin:20px auto}.box{padding:19px}.toolbar{align-items:flex-start}.brand{font-size:20px}}

:root{color-scheme:light}html{color-scheme:light}body{animation:admin-in .55s ease both}.top{animation:admin-drop .5s ease both}.login,.box{animation:admin-rise .55s ease both}.nav button,.btn,.secondary,.product{transition:transform .2s,box-shadow .2s,background .2s}.nav button:hover,.secondary:hover{transform:translateY(-2px);box-shadow:0 7px 16px #70466c12}.btn:hover{transform:translateY(-2px);box-shadow:0 9px 20px #ce78ae55}.product{animation:admin-rise .4s ease both}.product:hover{transform:translateY(-2px);box-shadow:0 9px 20px #70466c10}#dlg:not(.hidden)>div{animation:admin-pop .22s ease both}@keyframes admin-in{from{opacity:0}to{opacity:1}}@keyframes admin-drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}@keyframes admin-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes admin-pop{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Bright, cheerful admin palette */
body{background:linear-gradient(135deg,#fff4fb 0%,#fff9e9 48%,#effaff 100%);color:#a52e83}
.top{background:linear-gradient(105deg,#ff69b2,#b978ff,#61c8ee,#ffad67);color:#fff;box-shadow:0 8px 24px #d879b344}
.brand{color:#fff}.brand span{color:#fff4a8}.top a{color:#fff}
.box{background:linear-gradient(145deg,#fff,#fff8fd);border:1px solid #f6cce6;box-shadow:0 15px 40px #d779b322}
.login h1,.box h1,.toolbar h2{color:#bd398f}
.muted{color:#ad639b}
.field label{color:#b23a91}.field input,.field textarea{border:1px solid #f0c4e1;background:#fffaff;color:#a52e83}
.field input:focus,.field textarea:focus{border-color:#c17cff;box-shadow:0 0 0 4px #e3c7ff55}
.btn{background:linear-gradient(105deg,#ff63ad,#bd75ff,#ff9f68);color:white;box-shadow:0 7px 18px #d36ab344}
.secondary{border:1px solid #f2c8e4;background:linear-gradient(110deg,#fff0f8,#f0e8ff);color:#a43a8d}
.notice{background:linear-gradient(110deg,#ffe0f0,#e9ddff);color:#9c398b}.error{background:#ffe5e9;color:#c43d73}
.nav button{background:linear-gradient(120deg,#fff1f8,#f4edff);color:#a44791}
.nav button.active{background:linear-gradient(110deg,#ffbada,#dfc5ff,#bceaff);border-color:#edb9e0;color:#9e3189}
.tablewrap{border-color:#f3d0e7}th{color:#ad639b;background:linear-gradient(100deg,#fff1f8,#f3edff)}
td{border-color:#f6dfed;color:#a34b90}td select{border-color:#efc6e2;color:#a33b8c;background:#fffaff}
.product{border-color:#f3cde6;background:linear-gradient(110deg,#fff9fd,#fff5fb,#f7f3ff)}
.product h3{color:#b13b91}
.empty{background:linear-gradient(120deg,#fff5fb,#f3efff);border-color:#edc3df;color:#ac5d98}
#dlg{background:linear-gradient(135deg,#e96cb477,#9e72e477)!important}
#dlg>.box{background:linear-gradient(145deg,#fff,#fff5fb)}

</style></head><body><header class="top"><div class="brand">Crazy<span>Creations</span> / ADMIN</div><a href="index.html">← View shop</a></header><div class="wrap"><section id="login" class="box login"><h1>Admin sign in</h1><p class="muted">Manage craft supplies, orders and deliveries.</p><form onsubmit="login(event)"><div class="field"><label>Admin PIN</label><input id="pin" type="password" required></div><div id="loginMsg"></div><button class="btn wide">Sign in</button></form></section><section id="dash" class="box hidden"><div class="toolbar"><div><h1>Store dashboard</h1><span class="muted">Your craft shop control centre</span></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="layout"><nav class="nav"><button class="active" onclick="tab('orders',this)">Orders & delivery</button><button onclick="tab('products',this)">Products</button><button onclick="tab('settings',this)">Website settings</button></nav><div id="content">Loading…</div></div></section></div>
<div id="dlg" class="hidden" style="position:fixed;inset:0;background:#0009;z-index:4;display:flex;align-items:center;justify-content:center;padding:15px"><div class="box" style="width:min(570px,100%);max-height:90vh;overflow:auto"><div class="toolbar"><h2 id="dlgTitle">Add product</h2><button class="secondary" onclick="closeDlg()">Close</button></div><form onsubmit="saveProduct(event)"><input id="pid" type="hidden"><div class="field"><label>Product name *</label><input id="pname" required></div><div class="field"><label>Description</label><textarea id="pdesc"></textarea></div><div class="field"><label>Price (£)</label><input id="pprice" type="number" min="0" step=".01" required></div><div class="field"><label>Stock</label><input id="pstock" type="number" min="0" required></div><div class="field"><label>Image URL</label><input id="pimage" type="url"></div><div class="field"><label><input id="pactive" type="checkbox" checked style="width:auto"> Visible in shop</label></div><button class="btn wide">Save product</button></form></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbySzBM9pwxqNBwz_Ck2WF6IG7P0wiurQwqmg-mrsSqVwFas4-RymXuxkc5T7qtlE_QE/exec";let token='',data=null,section='orders';
function api(action,payload={}){return new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/(?:a\/)?macros\/(?:s\/|[^/]+\/s\/)[A-Za-z0-9_-]+\/exec$/.test(API))return reject(Error('Add your deployed Apps Script URL to admin.html.'));let cb='adm'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('Apps Script did not respond. Check URL and deployment access.'))},20000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{clean();r&&r.ok?resolve(r.data):reject(Error(r?.error||'Request failed'))};s.onerror=()=>{clean();reject(Error('Could not connect to Apps Script.'))};s.src=API+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload))+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Number(n||0).toFixed(2);
function notice(id,s,err=false){document.getElementById(id).innerHTML='<div class="notice '+(err?'error':'')+'">'+esc(s)+'</div>'}
async function login(e){e.preventDefault();try{let r=await api('login',{pin:document.getElementById('pin').value});token=r.token;document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');await refresh()}catch(e){notice('loginMsg',e.message,true)}}
function logout(){token='';data=null;document.getElementById('dash').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('pin').value=''}
async function refresh(){data=await api('adminData',{token});render()}
function tab(t,b){section=t;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}
function render(){if(!data)return;let el=document.getElementById('content');if(section==='orders'){let a=data.orders||[];el.innerHTML='<div class="toolbar"><h2>Orders & delivery</h2><button class="secondary" onclick="refresh()">Refresh</button></div>'+(a.length?'<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>'+a.map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><small>'+esc(o.date)+'</small></td><td><b>'+esc(o.customer)+'</b><br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+esc(o.items)+'</td><td>'+money(o.total)+'<br><small>Pay on delivery</small></td><td><select onchange="updateOrder(\''+esc(o.id)+'\',this.value)">'+['New','Processing','Dispatched','Out for delivery','Delivered','Cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No orders yet. New orders appear here.</div>')+'<p><a target="_blank" href="'+esc(data.sheetUrl)+'">Open connected Google Sheet ↗</a></p>'}
else if(section==='products'){el.innerHTML='<div class="toolbar"><h2>Products</h2><button class="btn" onclick="openDlg()">+ Add product</button></div>'+(data.products.length?data.products.map(p=>'<div class="product"><div><h3>'+esc(p.name)+'</h3><span class="muted">'+money(p.price)+' · Stock '+esc(p.stock)+' · '+(p.active?'Visible':'Hidden')+'</span></div><div class="actions"><button class="secondary" onclick="openDlg(\''+esc(p.id)+'\')">Edit</button><button class="secondary" onclick="delProduct(\''+esc(p.id)+'\')">Delete</button></div></div>').join(''):'<div class="empty">No products yet. Add your first product.</div>')}
else{el.innerHTML='<h2>Website settings</h2><form onsubmit="saveSettings(event)"><div class="field"><label>Store name</label><input id="sname" value="'+esc(data.settings.StoreName||'CrazyCreations')+'"></div><div class="field"><label>Announcement banner</label><input id="sannouncement" value="'+esc(data.settings.Announcement||'')+'"></div><div class="field"><label>Delivery message</label><input id="sdelivery" value="'+esc(data.settings.DeliveryMessage||'Pay on delivery')+'"></div><button class="btn">Save settings</button></form><p><a target="_blank" href="'+esc(data.sheetUrl)+'">Open Google Sheets database ↗</a></p>'}}
async function updateOrder(id,status){try{await api('updateOrder',{token,id,status});await refresh()}catch(e){alert(e.message)}}
function openDlg(id=''){let p=(data.products||[]).find(x=>x.id===id);document.getElementById('dlgTitle').textContent=p?'Edit product':'Add product';document.getElementById('pid').value=p?.id||'';document.getElementById('pname').value=p?.name||'';document.getElementById('pdesc').value=p?.description||'';document.getElementById('pprice').value=p?.price??'';document.getElementById('pstock').value=p?.stock??0;document.getElementById('pimage').value=p?.image||'';document.getElementById('pactive').checked=!p||p.active;document.getElementById('dlg').classList.remove('hidden')}
function closeDlg(){document.getElementById('dlg').classList.add('hidden')}
async function saveProduct(e){e.preventDefault();let p={token,id:document.getElementById('pid').value,name:document.getElementById('pname').value,description:document.getElementById('pdesc').value,price:document.getElementById('pprice').value,stock:document.getElementById('pstock').value,image:document.getElementById('pimage').value,active:document.getElementById('pactive').checked};try{await api('saveProduct',p);closeDlg();await refresh()}catch(e){alert(e.message)}}
async function delProduct(id){if(!confirm('Delete this product?'))return;try{await api('deleteProduct',{token,id});await refresh()}catch(e){alert(e.message)}}
async function saveSettings(e){e.preventDefault();try{await api('saveSettings',{token,settings:{StoreName:document.getElementById('sname').value,Announcement:document.getElementById('sannouncement').value,DeliveryMessage:document.getElementById('sdelivery').value}});await refresh();alert('Settings saved')}catch(e){alert(e.message)}}
</script></body></html>
